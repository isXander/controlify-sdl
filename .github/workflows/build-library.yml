name: Build Library

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-library-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Java libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build libraries
        run: >-
          ./gradlew
          :sdl-api:build
          :sdl-backend-ffm:build
          --stacktrace

      - name: Upload library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: controlify-sdl-libraries
          if-no-files-found: error
          path: |
            sdl-api/build/libs/*.jar
            sdl-backend-ffm/build/libs/*.jar

      - name: Publish libraries
        if: github.event_name != 'pull_request'
        run: >-
          ./gradlew
          :sdl-api:publishApiPublicationToXanderMavenRepository
          :sdl-backend-ffm:publishFfmPublicationToXanderMavenRepository
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_XanderMavenUsername: ${{ secrets.XANDER_MAVEN_USER }}
          ORG_GRADLE_PROJECT_XanderMavenPassword: ${{ secrets.XANDER_MAVEN_PASS }}
